# Gradle Version Catalog for MovieBox
# This file centralizes dependency versions

[versions]
androidGradlePlugin = "8.2.1"
kotlin = "1.9.23"
composeCompiler = "1.5.11"
composeUi = "1.6.7"
composeMaterial3 = "1.2.0"
composeRuntime = "1.6.7"
composeFoundation = "1.6.7"
lifecycle = "2.8.0"
activity = "1.7.2"
fragment = "1.6.0"
navigation = "2.7.7"
hilt = "2.48"
room = "2.5.2"
exoplayer = "1.3.2"
glide = "4.16.0"
gson = "2.10.1"
coroutines = "1.7.3"
coreKtx = "1.13.0"
material = "1.12.0"
constraintLayout = "2.1.4"
junit = "4.13.2"
espresso = "3.5.0"
androidxTest = "1.5.0"
androidxRule = "1.5.0"
mockito = "5.1.1"
mockitoKotlin = "5.1.0"

[libraries]
# Android Gradle Plugin
android-application = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
kotlin-android = { group = "org.jetbrains.kotlin", name = "kotlin-android", version.ref = "kotlin" }
kotlin-serialization = { group = "org.jetbrains.kotlin", name = "kotlin-serialization", version.ref = "kotlin" }
kotlin-kapt = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-parcelize = { group = "org.jetbrains.kotlin", name = "kotlin-android", version.ref = "kotlin" }
hilt-android = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
google-services = { group = "com.google.gms", name = "google-services", version = "4.4.1" }
navigation-safe-args = { group = "androidx.navigation", name = "navigation-safe-args-gradle-plugin", version.ref = "navigation" }

# AndroidX Core
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
preference = { group = "androidx.preference", name = "preference", version = "1.2.0" }
cardview = { group = "androidx.cardview", name = "cardview", version = "1.0.0" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version = "1.3.1" }
material3 = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version = "2024.05.00" }
compose-compiler = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "composeCompiler" }
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeUi" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "composeFoundation" }
compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "composeUi" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "composeRuntime" }
compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata", version.ref = "composeRuntime" }
compose-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composeUi" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "composeUi" }
compose-ui-text = { group = "androidx.compose.ui", name = "ui-text", version.ref = "composeUi" }
compose-ui-unit = { group = "androidx.compose.ui", name = "ui-unit", version.ref = "composeUi" }
compose-ui-layout = { group = "androidx.compose.ui", name = "ui-layout", version.ref = "composeUi" }
compose-ui-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }

# Room Database
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ExoPlayer
exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "exoplayer" }
exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "exoplayer" }
exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "exoplayer" }
exoplayer-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "exoplayer" }

# Image Loading
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }

# JSON
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Coroutines
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# OkHttp
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version = "4.12.0" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version = "4.12.0" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-ext = { group = "androidx.ext", name = "ext", version.ref = "androidxTest" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-rule = { group = "androidx.test", name = "rules", version.ref = "androidxRule" }
androidx-runner = { group = "androidx.test", name = "runner", version.ref = "androidxRule" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-parcelize = { id = "kotlin-parcelize", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version = "4.4.1" }
navigation-safe-args = { id = "androidx.navigation.safeargs", version.ref = "navigation" }